name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt ruff==0.11.11 pip-audit==2.9.0 cyclonedx-bom==7.1.0
      - run: ruff check backend ml
      - run: PYTHONPATH=backend pytest backend/tests -q --junitxml=backend-junit.xml
      - run: PYTHONPATH=backend:ml pytest ml/tests -q
      - run: PYTHONPATH=backend python -m py_compile backend/app/main.py backend/app/phase28_router.py
      - run: cd backend && DATABASE_URL=sqlite:///phase28-ci.db alembic upgrade head && alembic downgrade 0013_monitoring_drift && alembic upgrade head
      - run: python scripts/validate_repository_artifacts.py
      - run: PYTHONPATH=backend pytest backend/tests/test_consistency_engine.py backend/tests/test_phase28_modelops.py -q
      - run: python scripts/generate_validation_docs.py backend-junit.xml validation-summary.md
      - run: cyclonedx-py requirements backend/requirements.txt -o sbom-python.json
      - uses: actions/upload-artifact@v4
        with: {name: backend-validation-sbom, path: "backend-junit.xml\nvalidation-summary.md\nsbom-python.json"}
      - run: pip-audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > sbom-npm.json
      - uses: actions/upload-artifact@v4
        with: {name: frontend-sbom, path: frontend/sbom-npm.json}
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
