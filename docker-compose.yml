services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: xray, POSTGRES_USER: xray, POSTGRES_PASSWORD: xray}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U xray], interval: 5s, timeout: 3s, retries: 10}
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://xray:xray@db:5432/xray
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DUMMY_MODE: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-dummy}
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck: {test: [CMD-SHELL, "bash -c '</dev/tcp/127.0.0.1/6333'"], interval: 5s, timeout: 3s, retries: 20}
  vllm:
    image: vllm/vllm-openai:latest
    profiles: [gpu]
    environment: {HF_HOME: /models/cache}
    command: ["--model", "${VLLM_MODEL_PATH:-Qwen/Qwen2.5-7B-Instruct}"]
    ports: ["8001:8000"]
    volumes: [vllm_models:/models]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes: {postgres_data: {}, qdrant_data: {}, vllm_models: {}}
